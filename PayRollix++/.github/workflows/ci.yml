name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt (Homebrew)
        run: |
          brew update
          brew install qt
      - name: Configure
        run: |
          mkdir -p build
          cmake -S . -B build -DCMAKE_PREFIX_PATH=$(brew --prefix qt) -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -- -j$(sysctl -n hw.ncpu)
      - name: Package
        run: echo "mac build complete"

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe install qt6-base:x64-windows
      - name: Configure
        run: |
          mkdir build
          cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE=./vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        run: echo "windows build complete"

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt (apt)
        run: sudo apt update && sudo apt install -y qtbase5-dev qtbase5-dev-tools
      - name: Configure
        run: |
          mkdir build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -- -j$(nproc)
      - name: Package
        run: echo "linux build complete"
